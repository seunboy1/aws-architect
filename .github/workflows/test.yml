name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 check_package.py
      - run: python3 skills/aws-architect/scripts/test_build.py
      - run: python3 skills/aws-architect/scripts/test_calculator_link.py
